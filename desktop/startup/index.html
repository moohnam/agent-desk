<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>Agent Desk</title>
<style>
  html, body { height: 100%; margin: 0; }
  body { display: flex; align-items: center; justify-content: center;
         font: 15px/1.6 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", sans-serif;
         background: #f5f6f8; color: #222; }
  @media (prefers-color-scheme: dark) { body { background: #1c1d21; color: #e6e6e6; } }
  .box { max-width: 520px; padding: 32px; text-align: center; }
  h1 { font-size: 20px; margin: 0 0 12px; }
  code { background: rgba(127,127,127,.18); padding: 1px 6px; border-radius: 4px; }
  button { margin-top: 18px; padding: 8px 20px; font-size: 14px; border-radius: 6px;
           border: 1px solid #888; background: transparent; color: inherit; cursor: pointer; }
  .muted { opacity: .65; font-size: 13px; margin-top: 10px; }
  #details { overflow-wrap: anywhere; white-space: pre-line; }
</style>
</head>
<body>
<div class="box">
  <h1 id="title">Agent Desk 허브에 연결하는 중입니다…</h1>
  <p id="hint">허브가 준비되면 대화 화면으로 넘어갑니다.</p>
  <p class="muted" id="target"></p>
  <p class="muted" id="details" hidden></p>
  <button id="retry">다시 시도</button>
  <p class="muted" id="status">허브가 뜨면 자동으로 연결합니다.</p>
</div>
<script>
  var HUB = window.__AGENT_DESK_HUB_URL__ || 'http://127.0.0.1:17641/';
  document.getElementById('target').textContent = HUB;
  var busy = false;
  async function check(manual, first = false) {
    if (busy) return; busy = true;
    const status = document.getElementById('status');
    const retry = document.getElementById('retry');
    if (manual) status.textContent = '확인 중…';
    try {
      const info = await window.__TAURI__.core.invoke('desk_startup', { retry: manual || first });
      if (info.ready) { location.href = HUB; return; }
      if (info.error || info.starting || manual || first) {
        status.textContent = info.error || (info.starting ? '허브를 시작하는 중입니다…' : '허브가 뜨면 자동으로 연결합니다.');
      }
      if (info.configurationError) retry.disabled = true;
      if (!info.logs) return;
      const hint = document.getElementById('hint');
      const details = document.getElementById('details');
      const unsafe = info.attempted && !info.canRestore;
      const version = value => /^[a-f0-9]{40}$/.test(value || '') ? value.slice(0, 12) : '미확인';
      const stage = { switching: '교체 중', failed: '교체 실패', waiting: '후보 대기', active: '현재 버전 활성' }[info.phase] || '확인 중';
      hint.textContent = unsafe
        ? '후보가 데이터를 변경했을 수 있습니다. 이 머신에서 실행 로그를 확인하고 수정된 후속 버전으로 복구하세요.'
        : info.blockedPort ? `${info.blockedPort} 포트를 사용하는 서비스의 작업이 끝나면 해당 서비스를 정상 종료하고 다시 시도하세요.`
          : info.canRestore ? '후보 실행 전에 교체가 멈췄습니다. 이전 버전으로 기동을 다시 시도할 수 있습니다.'
            : '관리형 허브가 뜨지 않으면 업데이트 실행 로그를 확인한 뒤 다시 시도하세요.';
      details.textContent = `상태 ${stage}\n현재 ${version(info.current)} · 후보 ${version(info.attempted || info.candidate)}\n실행 로그 ${info.logs}`;
      details.hidden = false;
      retry.disabled = Boolean(unsafe);
    } catch {
      if (manual) status.textContent = '허브의 상태를 확인하지 못했습니다.';
    } finally { busy = false; }
  }
  document.getElementById('retry').addEventListener('click', function () { check(true); });
  setInterval(function () { check(false); }, 1500);
  check(false, true);
</script>
</body>
</html>
